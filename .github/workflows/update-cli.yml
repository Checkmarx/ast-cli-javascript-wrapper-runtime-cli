name: Update Checkmarx AST CLI

on:
  workflow_dispatch:
    inputs:
      new_cli_version:
        description: 'New CLI version (optional)'
        required: false
  repository_dispatch:
    types: [cli-version-update]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-checkmarx-cli:
    name: Update Checkmarx AST CLI
    environment: release-automation
    permissions:
      contents: read  # for actions/checkout; the branch push and the PR use the GitHub App token
      id-token: write  # for configure-aws-credentials to assume the AWS role via OIDC
    runs-on: cx-public-ubuntu-x64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Fetch the latest Checkmarx AST CLI version
      - name: Get Latest Checkmarx API version
        id: checkmarx-ast-cli
        env:
          NEW_CLI_VERSION: ${{ github.event.inputs.new_cli_version || github.event.client_payload.version }}
        run: |
          if [ "$NEW_CLI_VERSION" ]; then
            if ! [[ "$NEW_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid CLI version: $NEW_CLI_VERSION"
              exit 1
            fi
            LATEST_VERSION="$NEW_CLI_VERSION"
          else
            LATEST_VERSION=$(curl -sL https://api.github.com/repos/Checkmarx/ast-cli/releases/latest | jq -r ".tag_name")
          fi
          CURRENT_VERSION=$(<checkmarx-ast-cli.version)
          echo "release_tag=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current_tag=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      # Update the version file if the latest version differs
      - name: Update Checkmarx CLI version in version file
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        env:
          RELEASE_TAG: ${{ steps.checkmarx-ast-cli.outputs.release_tag }}
        run: |
          echo "$RELEASE_TAG" > checkmarx-ast-cli.version

      # Download CLI binaries and generate checksums
      - name: Download CLI and generate checksums
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        env:
          RELEASE_TAG: ${{ steps.checkmarx-ast-cli.outputs.release_tag }}
        run: |
          VERSION=$RELEASE_TAG

          # Initialize checksums object
          CHECKSUMS='{}'

          # Platform configurations: platform_name,architecture,extension,os_platform
          PLATFORMS=(
            "windows,x64,zip,windows"
            "darwin,x64,tar.gz,darwin"
            "linux,x64,tar.gz,linux"
            "linux,arm64,tar.gz,linux"
            "linux,armv6,tar.gz,linux"
          )

          for PLATFORM_CONFIG in "${PLATFORMS[@]}"; do
            IFS=',' read -r OS_TYPE ARCH EXT OS_PLATFORM <<< "$PLATFORM_CONFIG"

            KEY="${OS_PLATFORM}_${ARCH}"
            URL="https://download.checkmarx.com/CxOne/CLI/${VERSION}/ast-cli_${VERSION}_${OS_PLATFORM}_${ARCH}.${EXT}"

            echo "Downloading checksum for ${KEY} from ${URL}..."

            # Download binary
            TEMP_FILE="/tmp/ast-cli_${KEY}.${EXT}"
            if curl -fsL -o "$TEMP_FILE" "$URL"; then
              # Calculate SHA-256
              CHECKSUM=$(sha256sum "$TEMP_FILE" | awk '{print $1}')
              echo "✓ ${KEY}: ${CHECKSUM}"

              # Update checksums JSON
              CHECKSUMS=$(echo "$CHECKSUMS" | jq --arg key "$KEY" --arg value "$CHECKSUM" '.[$key] = $value')

              # Cleanup
              rm -f "$TEMP_FILE"
            else
              echo "✗ Failed to download ${KEY}"
              exit 1
            fi
          done

          # Write checksums to file
          echo "$CHECKSUMS" | jq '.' > checkmarx-ast-cli.checksums
          echo "Checksums updated:"
          cat checkmarx-ast-cli.checksums

      - name: Configure AWS credentials
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        uses: step-security/configure-aws-credentials@1448016543d4432bd608e0de7871c7bf9e9be925 # v6.2.1
        with:
          role-to-assume: ${{ secrets.PLUGINS_APP_ROLE_ARN }}
          aws-region: ${{ secrets.PLUGINS_APP_AWS_REGION }}
          role-session-name: plugins-release-update-pr

      - name: Fetch GitHub App private key
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        uses: step-security/aws-secretsmanager-get-secrets@102b6b2a2528747bcc321bb99ef326d8be7ef58f # v3.0.1
        with:
          secret-ids: PLUGINS_APP_KEY,${{ secrets.PLUGINS_APP_SECRET_NAME }}

      - name: Mask each line of the private key
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        run: |
          while IFS= read -r line; do
            line="${line%$'\r'}"
            if [ -n "${line}" ]; then
              echo "::add-mask::${line}"
            fi
          done <<< "${PLUGINS_APP_KEY}"

      - name: Create GitHub App token
        id: app-token
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PLUGINS_APP_CLIENT_ID }}
          private-key: ${{ env.PLUGINS_APP_KEY }}
          permission-contents: write  # push the update branch
          permission-pull-requests: write  # open the PR and enable auto-merge

      - name: Remove the private key from the environment
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        run: echo "PLUGINS_APP_KEY=" >> "${GITHUB_ENV}"

      # Create a Pull Request with the version changes
      - name: Create Pull Request
        id: cretae_pull_request
        if: steps.checkmarx-ast-cli.outputs.current_tag != steps.checkmarx-ast-cli.outputs.release_tag
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: Update checkmarx-ast-cli to ${{ steps.checkmarx-ast-cli.outputs.release_tag }}
          title: Update checkmarx-ast-cli binaries with ${{ steps.checkmarx-ast-cli.outputs.release_tag }}
          body: |
            Updates [checkmarx-ast-cli][1] to ${{ steps.checkmarx-ast-cli.outputs.release_tag }}

            Auto-generated by [create-pull-request][2]

            [1]: https://github.com/Checkmarx/checkmarx-ast-cli
          labels: cxone
          branch: feature/update_cli_${{ steps.checkmarx-ast-cli.outputs.release_tag }}

      - name: Enable auto-merge (squash after 2 cx-maintainers approvals)
        if: steps.cretae_pull_request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cretae_pull_request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
